[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-data-diff"
version = "0.2.0"
description = "Episode-aware diff for LeRobot robot-training datasets: what changed in the data since the last good run?"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Japheth790" }]
keywords = [
    "lerobot",
    "robotics",
    "dataset",
    "diff",
    "imitation-learning",
    "huggingface",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "pyarrow>=12",
    "pandas>=2",
    "numpy>=1.24",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/Japheth790/robot-data-diff"
Issues = "https://github.com/Japheth790/robot-data-diff/issues"

[project.scripts]
robot-data-diff = "robot_data_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the Hugging Face Hub (deselected by default; run with -m network)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-local-folder = ["lerobot_fixtures"]
