name: Bug report
description: Something is wrong or crashes
labels: [bug]
body:
  - type: input
    id: datasets
    attributes:
      label: Dataset(s)
      description: Hugging Face ids with revisions, or how to build a small local dataset that shows the problem.
      placeholder: lerobot/pusht@v2.1 vs lerobot/pusht@v3.0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: robot-data-diff version
      description: Output of `robot-data-diff --version`
      placeholder: robot-data-diff 0.2.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Paste the output. For errors, rerun with `--verbose` and include the traceback.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: Ubuntu 24.04, Python 3.12
